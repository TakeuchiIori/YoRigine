name: DevelopBuild
on:
  push:
    branches:
      - '**'

env:
  SOLUTION_FILE_PATH: YoRigine.sln
  CONFIGURATION: Develop

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Premake to Generate Solution
        shell: cmd # 明示的にコマンドプロンプトで実行
        run: |
          .\premake.bat

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Develop Build
        # PlatformToolset=v143 を明示指定して上書きする。
        # Externals(ImGui/DirectXTex) の x64 構成が v145 を要求するが、
        # GitHub の windows-2022 ランナーには v143 までしか無く MSB8020 で失敗するため。
        # Develop 構成では Externals は Debug|x64(=v145) にマップされるので同様に上書きが必要。
        run: |
          msbuild ${{ env.SOLUTION_FILE_PATH }} /p:Platform=x64,Configuration=${{ env.CONFIGURATION }},PlatformToolset=v143
